<mat-sidenav-container class="app-shell">
  <mat-sidenav #sidenav class="app-sidenav" [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile || isExpanded" [fixedInViewport]="true" aria-label="Primary navigation">
    <div class="sidenav-brand"><mat-icon aria-hidden="true">task_alt</mat-icon><span>Task Portal</span></div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }" (click)="collapse()"><mat-icon matListItemIcon aria-hidden="true">dashboard</mat-icon><span matListItemTitle>Home</span></a>
      <a mat-list-item routerLink="/users" routerLinkActive="active-nav" (click)="collapse()"><mat-icon matListItemIcon aria-hidden="true">group</mat-icon><span matListItemTitle>Users</span></a>
      <a mat-list-item routerLink="/tasks" routerLinkActive="active-nav" (click)="collapse()"><mat-icon matListItemIcon aria-hidden="true">checklist</mat-icon><span matListItemTitle>Tasks</span></a>
      <a mat-list-item routerLink="/task-groups" routerLinkActive="active-nav" (click)="collapse()"><mat-icon matListItemIcon aria-hidden="true">folder</mat-icon><span matListItemTitle>Task Groups</span></a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      <button mat-icon-button class="mobile-menu-button" type="button" aria-label="Open navigation" (click)="toggle()"><mat-icon aria-hidden="true">menu</mat-icon></button>
      <a class="toolbar-title" routerLink="/">User Task Management Portal</a>
    </mat-toolbar>
  </mat-sidenav-content>
</mat-sidenav-container>
