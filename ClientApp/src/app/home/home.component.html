<section class="page-header home-header">
  <div><p class="eyebrow">Workspace overview</p><h1>User Task Management</h1><p class="page-intro">Organize users, track work, and group related tasks in one place.</p></div>
</section>
<section class="dashboard-grid" aria-label="Management areas">
  <a class="dashboard-link" *ngFor="let item of items" [routerLink]="item.route">
    <mat-card class="dashboard-card">
      <mat-icon class="dashboard-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
      <mat-card-header><mat-card-title>{{ item.title }}</mat-card-title></mat-card-header>
      <mat-card-content><p>{{ item.description }}</p></mat-card-content>
      <mat-card-actions><span class="card-action">Open {{ item.title }} <mat-icon aria-hidden="true">arrow_forward</mat-icon></span></mat-card-actions>
    </mat-card>
  </a>
</section>
