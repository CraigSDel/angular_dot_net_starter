<section class="page-header"><div><p class="eyebrow">People</p><h1 id="tableLabel">Users</h1><p class="page-intro">Manage the people assigned to work.</p></div></section>
<p class="error-state" role="alert" *ngIf="error"><mat-icon aria-hidden="true">error</mat-icon>{{ error }}</p>
<div class="content-grid">
  <mat-card class="panel-card">
    <mat-card-header><mat-card-title>All users</mat-card-title></mat-card-header>
    <mat-card-content>
      <div class="loading-state" *ngIf="isLoading"><mat-spinner diameter="32"></mat-spinner><span>Loading users...</span></div>
      <p class="empty-state" *ngIf="!isLoading && users.length === 0">No users yet.</p>
      <div class="table-scroll" *ngIf="!isLoading && users.length">
        <table mat-table [dataSource]="users" aria-labelledby="tableLabel">
          <ng-container matColumnDef="userId"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let user">{{ user.userId }}</td></ng-container>
          <ng-container matColumnDef="firstName"><th mat-header-cell *matHeaderCellDef>Firstname</th><td mat-cell *matCellDef="let user">{{ user.firstName }}</td></ng-container>
          <ng-container matColumnDef="lastName"><th mat-header-cell *matHeaderCellDef>Lastname</th><td mat-cell *matCellDef="let user">{{ user.lastName }}</td></ng-container>
          <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let user" class="actions-cell"><button mat-stroked-button type="button" (click)="edit(user)"><mat-icon aria-hidden="true">edit</mat-icon>Edit</button><button mat-button color="warn" type="button" (click)="delete(user)"><mat-icon aria-hidden="true">delete</mat-icon>Delete</button></td></ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="panel-card form-card"><mat-card-header><mat-card-title>{{ userForm.value.userId ? 'Edit user' : 'Add user' }}</mat-card-title></mat-card-header><mat-card-content>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit(userForm.value)">
      <mat-form-field appearance="outline"><mat-label>Firstname</mat-label><input matInput id="firstName" type="text" formControlName="firstName"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Lastname</mat-label><input matInput id="lastName" type="text" formControlName="lastName"></mat-form-field>
      <div class="form-actions"><button mat-button type="button" (click)="clear()">Clear</button><button mat-flat-button color="primary" type="submit">Save</button></div>
    </form>
  </mat-card-content></mat-card>
</div>
